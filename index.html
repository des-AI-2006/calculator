<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A modern, aesthetic, glassmorphic calculator with calculation history, keyboard shortcuts, sound feedback, and dark/light themes.">
  <meta name="theme-color" content="#0f172a">
  <title>Nexus Calc — Modern Aesthetic Calculator</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Ambient Background Mesh / Glow Orbs -->
  <div class="ambient-glow orb-1" aria-hidden="true"></div>
  <div class="ambient-glow orb-2" aria-hidden="true"></div>
  <div class="ambient-glow orb-3" aria-hidden="true"></div>

  <main class="app-container">
    <div class="calculator-card" id="calculator" role="region" aria-label="Calculator">
      
      <!-- Top Action Bar -->
      <header class="calc-header">
        <div class="brand">
          <div class="brand-badge"></div>
          <span class="brand-name">NEXUS<span class="brand-accent">.CALC</span></span>
        </div>
        
        <div class="header-controls">
          <button type="button" class="icon-btn" id="soundToggleBtn" aria-label="Toggle Sound" title="Toggle Sound Feedback">
            <svg class="icon sound-on-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
            </svg>
            <svg class="icon sound-off-icon hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <line x1="23" y1="9" x2="17" y2="15"></line>
              <line x1="17" y1="9" x2="23" y2="15"></line>
            </svg>
          </button>

          <button type="button" class="icon-btn" id="historyToggleBtn" aria-label="Toggle History" title="View History (H)">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            <span class="history-badge hidden" id="historyBadge">0</span>
          </button>

          <button type="button" class="icon-btn" id="themeToggleBtn" aria-label="Toggle Theme" title="Switch Theme">
            <svg class="icon sun-icon hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <svg class="icon moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>
        </div>
      </header>

      <!-- Calculator Display -->
      <section class="display-container" aria-live="polite">
        <div class="display-header">
          <span class="calc-mode-pill">DEC</span>
          <button type="button" class="copy-btn" id="copyResultBtn" aria-label="Copy result to clipboard" title="Copy result">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            <span class="copy-text">Copy</span>
          </button>
        </div>

        <div class="expression-line" id="previousOperand" aria-label="Previous Expression"></div>
        <div class="current-line" id="currentOperand" aria-label="Current Value">0</div>
      </section>

      <!-- Calculator Keypad Grid -->
      <section class="keypad-grid" role="group" aria-label="Calculator Keypad">
        <!-- Row 1: Function Keys & Operator -->
        <button type="button" class="key key-fn key-ac" data-action="all-clear" id="key-ac" title="All Clear (Esc)">AC</button>
        <button type="button" class="key key-fn" data-action="delete" id="key-backspace" title="Backspace (⌫)">
          <svg class="icon key-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path>
            <line x1="18" y1="9" x2="12" y2="15"></line>
            <line x1="12" y1="9" x2="18" y2="15"></line>
          </svg>
        </button>
        <button type="button" class="key key-fn" data-action="percent" id="key-percent" title="Percentage (%)">%</button>
        <button type="button" class="key key-operator" data-operator="÷" id="key-divide" title="Divide (/)">÷</button>

        <!-- Row 2: 7, 8, 9, Multiply -->
        <button type="button" class="key key-number" data-number="7" id="key-7">7</button>
        <button type="button" class="key key-number" data-number="8" id="key-8">8</button>
        <button type="button" class="key key-number" data-number="9" id="key-9">9</button>
        <button type="button" class="key key-operator" data-operator="×" id="key-multiply" title="Multiply (*)">×</button>

        <!-- Row 3: 4, 5, 6, Subtract -->
        <button type="button" class="key key-number" data-number="4" id="key-4">4</button>
        <button type="button" class="key key-number" data-number="5" id="key-5">5</button>
        <button type="button" class="key key-number" data-number="6" id="key-6">6</button>
        <button type="button" class="key key-operator" data-operator="−" id="key-subtract" title="Subtract (-)">−</button>

        <!-- Row 4: 1, 2, 3, Add -->
        <button type="button" class="key key-number" data-number="1" id="key-1">1</button>
        <button type="button" class="key key-number" data-number="2" id="key-2">2</button>
        <button type="button" class="key key-number" data-number="3" id="key-3">3</button>
        <button type="button" class="key key-operator" data-operator="+" id="key-add" title="Add (+)">+</button>

        <!-- Row 5: Toggle Sign, 0, Decimal, Equals -->
        <button type="button" class="key key-fn" data-action="toggle-sign" id="key-plusminus" title="Positive/Negative (±)">±</button>
        <button type="button" class="key key-number" data-number="0" id="key-0">0</button>
        <button type="button" class="key key-number" data-action="decimal" id="key-decimal" title="Decimal point (.)">.</button>
        <button type="button" class="key key-equals" data-action="equals" id="key-equals" title="Calculate (Enter)">=</button>
      </section>

      <!-- Keyboard shortcuts helper footer -->
      <footer class="calc-footer">
        <span>Keyboard Active • <kbd>Enter</kbd> = <kbd>Esc</kbd> AC <kbd>⌫</kbd> Del</span>
      </footer>

      <!-- History Drawer Overlay & Panel -->
      <aside class="history-drawer" id="historyDrawer" aria-label="Calculation History" aria-hidden="true">
        <div class="history-header">
          <div class="history-title-wrap">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            <h3>History</h3>
          </div>
          <div class="history-actions">
            <button type="button" class="text-btn danger" id="clearHistoryBtn" title="Clear all history">Clear</button>
            <button type="button" class="icon-btn close-history-btn" id="closeHistoryBtn" aria-label="Close history">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>
        </div>

        <div class="history-list" id="historyList">
          <!-- Populated by JS -->
          <div class="history-empty" id="historyEmpty">
            <svg class="icon empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="4" y="2" width="16" height="20" rx="2"></rect>
              <line x1="8" y1="6" x2="16" y2="6"></line>
              <line x1="8" y1="10" x2="16" y2="10"></line>
              <line x1="8" y1="14" x2="12" y2="14"></line>
            </svg>
            <p>No calculations yet</p>
            <span>Your past math operations will appear here.</span>
          </div>
        </div>
      </aside>

    </div>
  </main>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toastContainer" aria-live="polite" aria-atomic="true"></div>

  <script src="script.js"></script>
</body>
</html>
